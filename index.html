<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="description" content="ROOT OS — Your Web. Your Workspace. Your OS.">
<title>ROOT OS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#05070b;
  --panel:#0b1018;
  --panel2:#111824;
  --border:#202b3a;
  --text:#f4f7fb;
  --muted:#8995a7;
  --accent:#54e6b0;
  --accent2:#36b8ff;
  --danger:#ff5d6c;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%,rgba(54,184,255,.08),transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(84,230,176,.07),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:rgba(5,7,11,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  z-index:1000;
}

.brand{
  font-size:19px;
  font-weight:900;
  letter-spacing:2px;
}

.brand span{
  color:var(--accent);
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
  color:white;
  display:grid;
  place-items:center;
}

.icon-btn:hover{
  border-color:#3b4b60;
}

/* =========================
   DESKTOP SIDEBAR
========================= */

.sidebar{
  position:fixed;
  top:64px;
  left:0;
  bottom:0;
  width:220px;
  padding:20px 14px;
  background:rgba(8,12,18,.94);
  border-right:1px solid var(--border);
  z-index:900;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  text-align:left;
  padding:13px;
  border-radius:12px;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  background:var(--panel2);
  color:white;
}

.nav button.active{
  box-shadow:inset 3px 0 var(--accent);
}

/* =========================
   MAIN
========================= */

main{
  margin-left:220px;
  padding:88px 25px 40px;
  min-height:100vh;
}

.page{
  display:none;
  max-width:1200px;
  margin:auto;
  animation:appear .2s ease;
}

.page.active{
  display:block;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================
   HOME HERO
========================= */

.hero{
  position:relative;
  overflow:hidden;
  padding:30px;
  border:1px solid var(--border);
  border-radius:24px;
  background:
    linear-gradient(135deg,rgba(54,184,255,.08),rgba(84,230,176,.04)),
    var(--panel);
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.hero::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border:1px solid rgba(84,230,176,.16);
  border-radius:50%;
  right:-60px;
  top:-60px;
}

.eyebrow{
  color:var(--accent);
  font-size:11px;
  letter-spacing:3px;
  font-weight:bold;
  margin-bottom:10px;
}

.hero h1{
  font-size:clamp(30px,6vw,54px);
  line-height:1.05;
  margin-bottom:12px;
}

.hero p{
  color:var(--muted);
  line-height:1.7;
  max-width:650px;
}

.system-status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:20px;
  padding:8px 12px;
  border:1px solid #254238;
  background:#0b1713;
  border-radius:20px;
  color:var(--accent);
  font-size:11px;
}

.dot{
  width:7px;
  height:7px;
  background:var(--accent);
  border-radius:50%;
  box-shadow:0 0 12px var(--accent);
}

/* =========================
   WIDGETS
========================= */

.widget-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.widget{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
}

.widget-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:9px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.widget-value{
  font-size:22px;
  font-weight:bold;
}

.clock{
  color:var(--accent);
}

/* =========================
   APP GRID
========================= */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0 13px;
}

.section-title h2{
  font-size:18px;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

.apps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.app-card{
  min-height:150px;
  border:1px solid var(--border);
  border-radius:17px;
  background:linear-gradient(145deg,var(--panel),#080d14);
  padding:18px;
  transition:.2s;
}

.app-card:hover{
  transform:translateY(-3px);
  border-color:#35455a;
  box-shadow:var(--shadow);
}

.app-icon{
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:#131c28;
  font-size:21px;
  margin-bottom:15px;
}

.app-card h3{
  font-size:15px;
  margin-bottom:6px;
}

.app-card p{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

/* =========================
   PANELS
========================= */

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
}

.panel h2{
  font-size:20px;
  margin-bottom:7px;
}

.panel p{
  color:var(--muted);
  line-height:1.6;
  margin-bottom:16px;
}

.text-input,
.text-area{
  width:100%;
  background:#060a10;
  color:white;
  border:1px solid var(--border);
  border-radius:11px;
  padding:12px;
  margin-bottom:10px;
}

.text-area{
  min-height:180px;
  resize:vertical;
}

.action{
  border:0;
  border-radius:10px;
  background:var(--accent);
  color:#04100b;
  padding:11px 15px;
  font-weight:bold;
}

.secondary{
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel2);
  color:white;
  padding:11px 15px;
}

.action:hover,
.secondary:hover{
  opacity:.88;
}

/* =========================
   SEARCH
========================= */

.search-box{
  position:relative;
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  color:white;
  padding:14px 16px;
}

/* =========================
   FILE HUB
========================= */

.file-drop{
  border:1px dashed #3b4a5d;
  border-radius:15px;
  padding:30px 20px;
  text-align:center;
  color:var(--muted);
  margin-bottom:15px;
}

.file-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.file-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px;
  background:#080d14;
  border:1px solid var(--border);
  border-radius:11px;
}

.file-item small{
  color:var(--muted);
}

   SETTINGS
========================= */

  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:
